spring.profiles.active=dev

app.file.storage-root=${APP_FILE_STORAGE_ROOT:./data/uploads}
app.file.public-base-url=${APP_FILE_PUBLIC_BASE_URL:}
app.file.maximum-size-bytes=${APP_FILE_MAXIMUM_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
server.forward-headers-strategy=framework
delivery.geocoding.url=${DELIVERY_GEOCODING_URL:https://nominatim.openstreetmap.org/search}
delivery.geocoding.reverse-url=${DELIVERY_GEOCODING_REVERSE_URL:https://nominatim.openstreetmap.org/reverse}
delivery.geocoding.user-agent=${DELIVERY_GEOCODING_USER_AGENT:CcAdmin-Ecommerce/1.0}
