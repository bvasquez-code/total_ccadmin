<div *ngIf="IsLoading$ | async" class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
  <div class="loading-panel">
    <div class="loading-indicator" aria-hidden="true"></div>
    <div class="loading-title">Procesando solicitud</div>
    <div class="loading-message">Espera un momento, por favor.</div>
  </div>
</div>
