<div role="main" class="main-content">
  <div class="page-content container container-plus">
    <div class="card-header">
      <h3 class="card-title text-125 text-primary-d2">
        <i class="far fa-edit text-dark-l3 mr-1"></i>
        Cargas masivas
      </h3>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card dcard">
          <div class="card-body px-1 px-md-3">
            <div autocomplete="off">
              <div class="d-flex justify-content-between flex-column flex-sm-row mb-3 px-2 px-sm-0">
                <div class="mb-2 mb-sm-0">
                  <a class="btn px-4 btn-primary mb-1"
                    href="enterprise/bulkload/pages/createbulkload">
                    Nueva carga
                  </a>
                </div>
                <div>
                  <button class="btn px-4 btn-light-secondary mb-1"
                    type="button"
                    [disabled]="loading"
                    (click)="findAll(search.Page)">
                    <i class="fa fa-sync-alt mr-1"
                      [ngClass]="loading ? 'fa-spin' : ''"></i>
                    Refrescar progreso
                  </button>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-3 mb-2">
                  <input class="form-control"
                    type="text"
                    placeholder="Código, archivo o usuario"
                    [(ngModel)]="search.Query"
                    (keyup.enter)="findAll(1)">
                </div>
                <div class="col-md-2 mb-2">
                  <select class="form-control" [(ngModel)]="search.BulkLoadType">
                    <option value="">Todos los tipos</option>
                    <option value="PRODUCT_PRICE">Precios</option>
                    <option value="STOCK_ENTRY">Stock</option>
                    <option value="PRODUCT_CREATE">Creación de productos</option>
                    <option value="BRAND_CREATE">Creación de marcas</option>
                    <option value="CATEGORY_CREATE">Creación de categorías</option>
                  </select>
                </div>
                <div class="col-md-3 mb-2">
                  <select class="form-control" [(ngModel)]="search.ProcessStatus">
                    <option value="">Todos los estados</option>
                    <option value="P">Pendiente de confirmación</option>
                    <option value="Q">En cola</option>
                    <option value="W">Procesando</option>
                    <option value="F">Finalizado</option>
                    <option value="E">Error</option>
                    <option value="X">Anulado</option>
                  </select>
                </div>
                <div class="col-md-2 mb-2">
                  <input class="form-control"
                    type="date"
                    title="Fecha inicial"
                    [(ngModel)]="search.DateStart">
                </div>
                <div class="col-md-2 mb-2">
                  <input class="form-control"
                    type="date"
                    title="Fecha final"
                    [(ngModel)]="search.DateEnd">
                </div>
              </div>

              <div class="mb-3">
                <button class="btn px-4 btn-primary"
                  type="button"
                  [disabled]="loading"
                  (click)="findAll(1)">
                  Buscar
                </button>
              </div>

              <app-table
                [data]="dataTablaGenetic"
                [action]="this">
              </app-table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
