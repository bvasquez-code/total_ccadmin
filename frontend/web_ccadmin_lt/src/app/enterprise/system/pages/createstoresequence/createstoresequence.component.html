<div role="main" class="main-content">

    <div class="page-content container container-plus">
        <div class="card acard mt-2 mt-lg-3">
            <div class="card-header">
                <h3 class="card-title text-125 text-primary-d2">
                    <i class="far fa-edit text-dark-l3 mr-1"></i>
                    {{ isEdit ? 'Editar secuencia por tienda' : 'Registrar secuencia para todas las tiendas' }}
                </h3>
            </div>

            <div class="card-body px-3 pb-1">
                <form class="mt-lg-3" autocomplete="off">

                    <div class="form-group row" *ngIf="isEdit">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Tienda</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="text"
                                readonly
                                [maxLength]="4"
                                (keypress)="validateKeypress($event,'txtStoreCod')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.StoreCod"
                                name="StoreCod">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Periodo</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="number"
                                [readonly]="isEdit"
                                (keypress)="validateKeypress($event,'txtNumber')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.PeriodId"
                                name="PeriodId">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Tipo de tabla</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="text"
                                [readonly]="isEdit"
                                [maxLength]="32"
                                list="sequenceTableTypes"
                                (keypress)="validateKeypress($event,'txtSequenceTableType')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.SequenceTableType"
                                name="SequenceTableType">
                            <datalist id="sequenceTableTypes">
                                <option *ngFor="let item of sequenceTableTypeList" [value]="item"></option>
                            </datalist>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Prefijo</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="text"
                                [maxLength]="2"
                                (keypress)="validateKeypress($event,'txtPrefix')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.Prefix"
                                name="Prefix">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Secuencia actual</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="number"
                                (keypress)="validateKeypress($event,'txtNumber')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.SequenceTrx"
                                name="SequenceTrx">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Longitud</label>
                        </div>

                        <div class="col-sm-9">
                            <input type="number"
                                (keypress)="validateKeypress($event,'txtNumber')"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="storeSequence.SequenceLength"
                                name="SequenceLength">
                        </div>
                    </div>

                    <div class="mt-5 border-t-1 bgc-secondary-l4 brc-secondary-l2 py-35 mx-n25">
                        <div class="offset-md-3 col-md-9 text-nowrap">
                            <a
                                class="btn btn-info btn-bold px-4"
                                type="button"
                                (click)="Save()">
                                <i class="fa fa-check mr-1"></i>
                                Guardar
                            </a>

                            <a class="btn btn-outline-lightgrey btn-bgc-white btn-bold ml-2 px-4"
                                type="reset"
                                href="/enterprise/system/pages/liststoresequence">
                                <i class="fa fa-undo mr-1"></i>
                                Volver
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
