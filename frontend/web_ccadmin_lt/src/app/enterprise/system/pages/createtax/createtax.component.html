<div role="main" class="main-content">
    <div class="page-content container container-plus">
        <div class="card acard mt-2 mt-lg-3">
            <div class="card-header">
                <h3 class="card-title text-125 text-primary-d2">
                    <i class="far fa-edit text-dark-l3 mr-1"></i>
                    {{ TaxCod !== '' ? 'Editar tributo' : 'Registrar tributo' }}
                </h3>
            </div>

            <div class="card-body px-3 pb-1">
                <form class="mt-lg-3" autocomplete="off">
                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Codigo</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="text"
                                [readonly]="txtTaxCodReadonly"
                                [maxLength]="8"
                                (keypress)="validateKeypress($event)"
                                class="form-control col-sm-8 col-md-6"
                                [(ngModel)]="tax.TaxCod"
                                name="TaxCod">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Codigo SUNAT</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="text" [maxLength]="8" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.SunatTaxCod" name="SunatTaxCod">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Nombre</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="text" [maxLength]="32" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.Name" name="Name">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Descripcion</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="text" [maxLength]="64" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.Description" name="Description">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Tipo de calculo</label>
                        </div>
                        <div class="col-sm-9">
                            <select class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.TaxCalculationType" name="TaxCalculationType" (change)="onCalculationTypeChange()">
                                <option value="P">Porcentaje</option>
                                <option value="F">Monto fijo por unidad</option>
                                <option value="N">No aplica</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Tasa</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="number" min="0" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.TaxRateValue" name="TaxRateValue" [disabled]="tax.TaxCalculationType !== 'P'">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Monto fijo por unidad</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="number" min="0" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.FixedUnitAmount" name="FixedUnitAmount" [disabled]="tax.TaxCalculationType !== 'F'">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Informativo</label>
                        </div>
                        <div class="col-sm-9">
                            <select class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.IsInformative" name="IsInformative">
                                <option value="N">No</option>
                                <option value="S">Si</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-3 col-form-label text-sm-right pr-0">
                            <label class="mb-0">Orden de calculo</label>
                        </div>
                        <div class="col-sm-9">
                            <input type="number" min="1" class="form-control col-sm-8 col-md-6" [(ngModel)]="tax.CalculationOrder" name="CalculationOrder">
                        </div>
                    </div>

                    <div class="mt-5 border-t-1 bgc-secondary-l4 brc-secondary-l2 py-35 mx-n25">
                        <div class="offset-md-3 col-md-9 text-nowrap">
                            <a class="btn btn-info btn-bold px-4" type="button" (click)="Save()">
                                <i class="fa fa-check mr-1"></i>
                                Guardar
                            </a>

                            <a class="btn btn-outline-lightgrey btn-bgc-white btn-bold ml-2 px-4" type="reset" href="/enterprise/system/pages/listtax">
                                <i class="fa fa-undo mr-1"></i>
                                Volver
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
