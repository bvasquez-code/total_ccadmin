<app-createcounterfoil *ngIf="InitializationMode && IsEditing"
    [InitializationMode]="true" [InitialCounterfoilCod]="SelectedCounterfoilCod" [InitialStoreCod]="InitialStoreCod"
    (ConfigurationCompleted)="counterfoilSaved()" (Cancelled)="IsEditing = false">
</app-createcounterfoil>

<div role="main" [class.main-content]="!InitializationMode" *ngIf="!IsEditing">

    <div class="page-content container container-plus">

        <div class="card-header">
            <h3 class="card-title text-125 text-primary-d2">
                <i class="far fa-edit text-dark-l3 mr-1"></i>
                Talonarios
            </h3>
        </div>

        <div class="alert alert-info mt-3" *ngIf="InitializationMode">
            El sistema ya incluye talonarios. Puede ajustar las series y el último correlativo utilizado,
            o continuar con la configuración actual.
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card dcard">
                    <div class="card-body px-1 px-md-3">
                        <div autocomplete="off">

                            <div class="d-flex justify-content-between flex-column flex-sm-row mb-3 px-2 px-sm-0">

                                <div class="mb-2 mb-sm-0">
                                    <a *ngIf="!InitializationMode" class="btn px-4 btn-primary mb-1" href="enterprise/cash/pages/createcounterfoil">
                                        Nuevo
                                    </a>
                                    <button *ngIf="InitializationMode" type="button" class="btn px-4 btn-primary mb-1"
                                        (click)="editCounterfoil()">
                                        Nuevo talonario
                                    </button>
                                </div>

                                <div class="pos-rel ml-sm-auto mr-sm-2 order-last order-sm-0">
                                    <i class="fa fa-search position-lc ml-25 text-primary-m1"></i>
                                    <input type="text" class="form-control w-100 pl-45 radius-1 brc-primary-m4"
                                        placeholder="Buscar ..." #txtSearch>
                                </div>

                                <div class="mb-2 mb-sm-0">
                                    <a class="btn px-4 btn-primary mb-1" (click)="filter(1)">
                                        Buscar
                                    </a>
                                </div>

                            </div>

                            <app-table [data]="table.dataTablaGenetic" [action]="this"></app-table>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-right mt-3" *ngIf="InitializationMode">
            <button type="button" class="btn btn-primary px-4" [disabled]="!HasLoadedCounterfoils"
                (click)="ConfigurationCompleted.emit()">
                Conservar talonarios y continuar
                <i class="fa fa-arrow-right ml-1"></i>
            </button>
        </div>

    </div>

</div>

<app-modalconfirm [id]="'modal_enable'" [action]="this"></app-modalconfirm>
<app-modalconfirm [id]="'modal_disable'" [action]="this"></app-modalconfirm>
