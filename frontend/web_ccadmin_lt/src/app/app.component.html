<app-spinner></app-spinner>
<div class="body-container" *ngIf="(getSession() == true)" [attr.inert]="(IsLoading$ | async) ? '' : null" [attr.aria-busy]="IsLoading$ | async">
    <app-header></app-header>

    <div class="main-container bgc-white">

        <app-menusidebar></app-menusidebar>

        <div role="main" class="main-content">
            <router-outlet></router-outlet>
            <app-footer></app-footer>
        </div>

    </div>
</div>
<div class="body-container" *ngIf="(getSession() == false)" [attr.inert]="(IsLoading$ | async) ? '' : null" [attr.aria-busy]="IsLoading$ | async">
    <router-outlet></router-outlet>
</div>
